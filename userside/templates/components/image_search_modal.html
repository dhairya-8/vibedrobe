<!--components/image_search_modal.html -->
<div class="modal fade" id="imageSearchModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Search by Image</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-md-7">
            <form id="image-search-form" method="post" action="{% url 'image_search' %}" enctype="multipart/form-data" class="triggers-loader" 
                            data-loader-text="Analyzing your image, please wait..."
                         novalidate>
              {% csrf_token %}

              <div class="upload-zone" id="upload-zone">
                <div class="upload-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="currentColor" class="bi bi-cloud-arrow-up" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M7.646 5.146a.5.5 0 0 1 .708 0l2 2a.5.5 0 0 1-.708.708L8.5 6.707V10.5a.5.5 0 0 1-1 0V6.707L6.354 7.854a.5.5 0 1 1-.708-.708z" />
                    <path d="M4.406 3.342A5.53 5.53 0 0 1 8 2c2.69 0 4.923 2 5.166 4.579C14.758 6.804 16 8.137 16 9.773 16 11.569 14.502 13 12.687 13H3.781C1.708 13 0 11.366 0 9.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383m.653.757c-.757.653-1.153 1.44-1.153 2.056v.448l-.445.049C2.064 6.805 1 7.952 1 9.318 1 10.785 2.23 12 3.781 12h8.906C13.98 12 15 10.988 15 9.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 4.825 10.328 3 8 3a4.53 4.53 0 0 0-2.941 1.1z" />
                  </svg>
                </div>
                <p>
                  <strong>Drag & Drop Image Here</strong>
                </p>
                <p class="text-secondary">or click to browse files</p>
              </div>

              <div class="preview-zone" id="preview-zone" style="display: none;">
                <img id="image-preview" src="#" alt="Image Preview" />
                <button type="button" class="remove-preview-btn" id="remove-preview-btn" title="Remove Image">&times;</button>
              </div>

              <input id="image-search-input" type="file" name="query_img" accept="image/*" required style="display: none;" />

              <div class="text-center mt-3">
                <button type="submit" class="btn btn-primary w-100" id="search-submit-btn">
                  <span class="btn-text">Find Similar Products</span>
                  <span class="btn-spinner" style="display: none;">
                    <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                    Searching...
                  </span>
                </button>
              </div>
            </form>
          </div>
          <div class="col-md-5 d-none d-md-block">
            <div class="search-tips">
              <h6>Tips for Best Results</h6>
              <ul>
                <li>Use clear, well-lit images.</li>
                <li>Focus on a single clothing item.</li>
                <li>Images with clean backgrounds work best.</li>
                <li>High-resolution photos provide more detail.</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .upload-zone {
    border: 2px dashed #ccc;
    border-radius: 10px;
    padding: 40px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .upload-zone:hover,
  .upload-zone.dragover {
    border-color: #007bff;
    background-color: #f8f9fa;
  }

  .upload-icon {
    color: #007bff;
    margin-bottom: 15px;
  }

  .preview-zone {
    position: relative;
    border: 2px solid #dee2e6;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
  }

  #image-preview {
    max-width: 100%;
    max-height: 300px;
    border-radius: 8px;
  }

  .remove-preview-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #dc3545;
    color: white;
    border: none;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.2s;
  }

  .remove-preview-btn:hover {
    background: #c82333;
  }

  .search-tips {
    background: #f8f9fa;
    padding: 20px;
    border-radius: 10px;
    height: 100%;
  }

  .search-tips h6 {
    font-weight: 600;
    margin-bottom: 15px;
  }

  .search-tips ul {
    padding-left: 20px;
    margin: 0;
  }

  .search-tips li {
    margin-bottom: 10px;
    color: #6c757d;
  }
</style>
